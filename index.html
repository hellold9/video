<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyTube</title>

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: sans-serif;
    }

    header {
      background: #181818;
      padding: 18px 24px;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      max-width: 1400px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }

    .card {
      cursor: pointer;
      transition: 0.2s;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 12px;
    }

    .card-title {
      margin-top: 10px;
      font-size: 16px;
    }

    .card-desc {
      font-size: 13px;
      color: #aaa;
      margin-top: 6px;
      line-height: 1.4;
    }
  </style>
</head>

<body>

<header>MyTube</header>

<div class="container">
  <div class="grid" id="videoGrid"></div>
</div>

<script src="videos.js"></script>
<script>
  const grid = document.getElementById("videoGrid");

  videos.forEach(video => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${video.cover}">
      <div class="card-title">${video.title}</div>
      <div class="card-desc">${video.desc}</div>
    `;

    card.onclick = () => {
      window.location.href = `watch.html?id=${video.id}`;
    };

    grid.appendChild(card);
  });
</script>

</body>
</html>
