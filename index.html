<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTube</title>

<style>
body{
  margin:0;
  background:#0f0f0f;
  color:#fff;
  font-family:sans-serif;
}

header{
  background:#181818;
  padding:18px 24px;
  font-size:22px;
  font-weight:bold;
}

.container{
  max-width:1400px;
  margin:40px auto;
  padding:0 20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:28px;
}

.card{
  cursor:pointer;
  transition:.3s;
  position:relative;
}

.card:hover{
  transform:translateY(-6px);
}

.card img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:14px;
}

.card-title{
  margin-top:12px;
  font-size:16px;
}

.card-desc{
  margin-top:6px;
  font-size:13px;
  color:#aaa;
}

.watched{
  position:absolute;
  top:10px;
  right:10px;
  background:rgba(0,0,0,0.7);
  padding:4px 8px;
  font-size:12px;
  border-radius:20px;
  color:#00ffae;
}
</style>
</head>

<body>

<header>MyTube</header>

<div class="container">
  <div class="grid" id="videoGrid"></div>
</div>

<script src="videos.js"></script>
<script src="index.js"></script>

<script>
const grid=document.getElementById("videoGrid");

// 读取已观看记录
const watchedVideos=JSON.parse(localStorage.getItem("watched"))||[];

videos.forEach(video=>{
  const card=document.createElement("div");
  card.className="card";

  card.innerHTML=`
    <img src="${video.cover}">
    <div class="card-title">${video.title}</div>
    <div class="card-desc">${video.desc}</div>
  `;

  // 如果已观看，加标记
  if(watchedVideos.includes(video.id)){
    const badge=document.createElement("div");
    badge.className="watched";
    badge.innerText="已观看";
    card.appendChild(badge);
  }

  card.onclick=()=>{
    window.location.href=`watch.html?id=${video.id}`;
  };

  grid.appendChild(card);
});
</script>

</body>
</html>
