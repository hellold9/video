<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyTube</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: #0f0f0f;
      color: #fff;
    }

    header {
      background: #181818;
      padding: 16px 24px;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      max-width: 1400px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 24px;
    }

    .video-card {
      cursor: pointer;
      transition: 0.2s;
    }

    .video-card:hover {
      transform: scale(1.03);
    }

    .video-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 12px;
      background: #222;
    }

    .video-title {
      margin-top: 10px;
      font-size: 15px;
      color: #ddd;
    }

    @media (max-width: 600px) {
      .video-card img {
        height: 140px;
      }
    }
  </style>
</head>

<body>

<header>
  MyTube
</header>

<div class="container">
  <div class="video-grid" id="videoGrid"></div>
</div>

<script>
  const videos = [
    {
      title: "示例视频 1",
      file: "video1.mp4",
      cover: "cover/cover1.jpg"
    },
    {
      title: "示例视频 2",
      file: "video2.mp4",
      cover: "cover/cover2.jpg"
    }
  ];

  const grid = document.getElementById("videoGrid");

  videos.forEach(video => {
    const card = document.createElement("div");
    card.className = "video-card";

    card.innerHTML = `
      <img src="${video.cover}" alt="${video.title}">
      <div class="video-title">${video.title}</div>
    `;

    card.onclick = () => {
      window.location.href = `watch.html?video=${video.file}`;
    };

    grid.appendChild(card);
  });
</script>

</body>
</html>
