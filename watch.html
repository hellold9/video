<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>播放页</title>

  <!-- 不蒜子统计 -->
  <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: sans-serif;
    }

    header {
      background: #181818;
      padding: 18px 24px;
    }

    .layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 30px;
      max-width: 1400px;
      margin: 30px auto;
      padding: 0 20px;
    }

    video {
      width: 100%;
      border-radius: 12px;
      background: black;
    }

    h1 {
      margin-top: 20px;
      font-size: 22px;
    }

    .desc {
      margin-top: 15px;
      background: #181818;
      padding: 15px;
      border-radius: 12px;
      color: #ccc;
      line-height: 1.6;
    }

    .stats {
      margin-top: 12px;
      font-size: 14px;
      color: #aaa;
    }

    .recommend {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .recommend-item {
      display: flex;
      gap: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .recommend-item:hover {
      transform: scale(1.03);
    }

    .recommend-item img {
      width: 120px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
    }

    #tcomment {
      margin-top: 40px;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html" style="color:white;text-decoration:none;">← MyTube</a>
</header>

<div class="layout">

  <!-- 左侧 -->
  <div>
    <video id="player" controls autoplay></video>
    <h1 id="title"></h1>

    <!-- 统计 -->
    <div class="stats">
      👁 本视频播放量：
      <span id="busuanzi_value_page_pv"></span>
    </div>

    <div class="desc" id="desc"></div>

    <!-- 评论 -->
    <div id="tcomment"></div>
  </div>

  <!-- 右侧推荐 -->
  <div class="recommend" id="recommend"></div>

</div>

<script src="videos.js"></script>

<script>
  const params = new URLSearchParams(location.search);
  const id = params.get("id");

  const player = document.getElementById("player");
  const title = document.getElementById("title");
  const desc = document.getElementById("desc");
  const recommend = document.getElementById("recommend");

  const current = videos.find(v => v.id === id) || videos[0];

  player.src = "video/" + current.file;
  title.textContent = current.title;
  desc.textContent = current.desc;

  // 推荐视频
  videos.forEach(video => {
    if (video.id !== current.id) {
      const item = document.createElement("div");
      item.className = "recommend-item";
      item.innerHTML = `
        <img src="${video.cover}">
        <div>${video.title}</div>
      `;
      item.onclick = () => {
        window.location.href = `watch.html?id=${video.id}`;
      };
      recommend.appendChild(item);
    }
  });
</script>

<!-- Twikoo 评论 -->
<script src="https://cdn.jsdelivr.net/npm/twikoo@1.6.44/dist/twikoo.min.js"></script>
<script>
twikoo.init({
  envId: '你的环境ID',
  el: '#tcomment',
  path: location.pathname + location.search
})
</script>

</body>
</html>
