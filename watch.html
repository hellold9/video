<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>播放页</title>

<!-- 不蒜子 -->
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
  background:
    radial-gradient(circle at 20% 20%, #1a1a2e 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, #16213e 0%, transparent 40%),
    #0f0f0f;
  color:#fff;
  animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}

header{
  padding:20px 30px;
  backdrop-filter:blur(10px);
  background:rgba(20,20,20,0.6);
  border-bottom:1px solid rgba(255,255,255,0.05);
}

header a{
  color:#fff;
  text-decoration:none;
  font-size:20px;
  font-weight:bold;
}

.layout{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:40px;
  max-width:1400px;
  margin:40px auto;
  padding:0 30px;
}

video{
  width:100%;
  border-radius:16px;
  background:black;
  box-shadow:
    0 0 40px rgba(0,150,255,0.15),
    0 20px 40px rgba(0,0,0,0.5);
  transition:0.4s;
}

video:hover{
  box-shadow:
    0 0 60px rgba(0,200,255,0.25),
    0 25px 50px rgba(0,0,0,0.6);
}

h1{
  margin-top:25px;
  font-size:26px;
}

.stats{
  margin-top:10px;
  font-size:14px;
  color:#aaa;
}

.desc{
  margin-top:20px;
  padding:20px;
  border-radius:18px;
  backdrop-filter:blur(15px);
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  line-height:1.7;
  transition:0.3s;
}

.desc:hover{
  background:rgba(255,255,255,0.08);
}

.recommend{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.recommend-item{
  display:flex;
  gap:12px;
  padding:10px;
  border-radius:14px;
  cursor:pointer;
  transition:0.3s;
  background:rgba(255,255,255,0.03);
}

.recommend-item:hover{
  transform:translateY(-4px);
  background:rgba(255,255,255,0.08);
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.recommend-item img{
  width:130px;
  height:75px;
  object-fit:cover;
  border-radius:10px;
}

#tcomment{
  margin-top:50px;
}

@media(max-width:900px){
  .layout{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
<a href="index.html">← MyTube</a>
</header>

<div class="layout">

<div>
  <video id="player" controls autoplay></video>
  <h1 id="title"></h1>

  <div class="stats">
    👁 本视频播放量：
    <span id="busuanzi_value_page_pv"></span>
  </div>

  <div class="desc" id="desc"></div>

  <div id="tcomment"></div>
</div>

<div class="recommend" id="recommend"></div>

</div>

<script src="videos.js"></script>

<script>
const params=new URLSearchParams(location.search);
const id=params.get("id");

const player=document.getElementById("player");
const title=document.getElementById("title");
const desc=document.getElementById("desc");
const recommend=document.getElementById("recommend");

const current=videos.find(v=>v.id===id)||videos[0];

player.src="video/"+current.file;
title.textContent=current.title;
desc.textContent=current.desc;

videos.forEach(video=>{
  if(video.id!==current.id){
    const item=document.createElement("div");
    item.className="recommend-item";
    item.innerHTML=`
      <img src="${video.cover}">
      <div>${video.title}</div>
    `;
    item.onclick=()=>{
      window.location.href=`watch.html?id=${video.id}`;
    };
    recommend.appendChild(item);
  }
});
</script>

<!-- Twikoo -->
<script src="https://cdn.jsdelivr.net/npm/twikoo@1.6.44/dist/twikoo.min.js"></script>
<script>
twikoo.init({
  envId:'你的环境ID',
  el:'#tcomment',
  path:location.pathname+location.search
})
</script>

</body>
</html>
